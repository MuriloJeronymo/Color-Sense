<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>ColorSense — Conta-gotas</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 100vw; height: 100vh; overflow: hidden; background: #000; cursor: crosshair; }
    /* posição e tamanho definidos em picker.js, em coordenadas da tela */
    #shot { position: fixed; image-rendering: pixelated; }

    /* Cores neutras (cinza e branco): a instrução e a lupa não dependem de cor */
    #hint {
      position: fixed; top: 16px; left: 50%; transform: translateX(-50%);
      background: rgba(20, 20, 20, .88); color: #fff;
      font: 600 13px -apple-system, 'Segoe UI', sans-serif;
      padding: 8px 16px; border-radius: 999px; border: 1px solid rgba(255,255,255,.35);
      pointer-events: none;
    }

    #loupe {
      position: fixed; pointer-events: none; display: none;
      background: rgba(20, 20, 20, .92); border: 1px solid rgba(255,255,255,.5);
      border-radius: 10px; padding: 6px;
    }
    #zoom { display: block; width: 132px; height: 132px; image-rendering: pixelated; border-radius: 6px; }
    #info { display: flex; align-items: center; gap: 6px; margin-top: 6px; color: #fff; font: 600 12px Consolas, monospace; }
    #swatch { width: 16px; height: 16px; border-radius: 4px; border: 1px solid #fff; }
  </style>
</head>
<body>
  <canvas id="shot"></canvas>
  <div id="hint">Clique para capturar a cor · Esc ou botão direito para cancelar</div>
  <div id="loupe">
    <canvas id="zoom" width="11" height="11"></canvas>
    <div id="info"><span id="swatch"></span><span id="hex">#000000</span></div>
  </div>
  <script src="picker.js"></script>
</body>
</html>
